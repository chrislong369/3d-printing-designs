name: Build Site Data

on:
  push:
    branches: [main]
    paths:
      - 'Final_Products/**'
      - 'In_Progress/**'
      - 'Personal/**'
      - 'Downloaded_Models/**'
      - 'Needs_Review/**'
      - 'scripts/build_site_products.py'
      - '.github/workflows/build-site-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate product JSON
        run: python scripts/build_site_products.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add website/data/site-products.json
          if git diff --cached --quiet; then
            echo "No site data changes"
          else
            git commit -m "Auto-update site product data"
            git push
          fi
